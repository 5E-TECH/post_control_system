name: CI/CD Deploy (Selective Build + Systemd + Cache)

on:
  push:
    branches:
      - main

# ⚠️ Bir vaqtda faqat BITTA prod deploy. Ikki run parallel ketsa ular
# bir xil webroot va bir xil bazaga yozadi: rm -rf bilan cp oralig'ida
# ikkinchisi aralashsa sayt yirtiq holatda qolishi mumkin.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # 🛡️ Faza 0 — xavfsizlik gate'i. Deploy'dan OLDIN ishlaydi.
  #   • audit:roles + guard testi — BLOKLOVCHI (yashil): RolesGuard fail-closed
  #     invariantini muhofaza qiladi (himoyalangan endpoint @AcceptRoles'siz qolmasin).
  #   • To'liq `npm test` — hozircha INFORMATSION (continue-on-error): 3 ta suite
  #     oldindan qizil (order-bot / courier-scanner / post.service). O'shalar
  #     tuzatilgach `continue-on-error`ni olib tashlab, to'liq testni bloklovchi qiling.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache server node_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: server-

      - name: Install server dependencies
        working-directory: server
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: 🛡️ RBAC fail-closed audit (BLOKLOVCHI)
        working-directory: server
        run: npm run audit:roles

      - name: 🛡️ Guard + investor leak unit-testlari (BLOKLOVCHI)
        working-directory: server
        run: npx jest src/common/guards src/api/investor --ci

      - name: 🧪 To'liq test to'plami (informatsion — oldindan mavjud xatolar)
        working-directory: server
        continue-on-error: true
        run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ Generate GitHub App token
      - name: Setup GitHub App token
        uses: tibdex/github-app-token@v2
        id: generate_token
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # 4️⃣ Determine changed directories (merge-safe version)
      - name: Determine changed directories
        id: changes
        run: |
          git fetch --deepen=50
          # For merge commits, compare both parents to get all changed files
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            MERGE_BASE=$(git merge-base HEAD^1 HEAD^2)
            CHANGED_DIRS=$(git diff --name-only $MERGE_BASE HEAD | awk -F/ '{print $1}' | sort -u | tr '\n' ' ')
          else
            CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | awk -F/ '{print $1}' | sort -u | tr '\n' ' ')
          fi
          echo "changed=$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "🧾 Changed directories: $CHANGED_DIRS"

      # 5️⃣ Cache client node_modules
      - name: Cache client node_modules
        if: contains(steps.changes.outputs.changed, 'client')
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: client-${{ hashFiles('client/package-lock.json') }}
          restore-keys: client-

      # 6️⃣ Cache server node_modules
      - name: Cache server node_modules
        if: contains(steps.changes.outputs.changed, 'server')
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-${{ hashFiles('server/package-lock.json') }}
          restore-keys: server-

      # 7️⃣ Deploy to Production Server
      - name: Deploy to Production Server
        env:
          CHANGED_DIRS: ${{ steps.changes.outputs.changed }}
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > server_key.pem
          chmod 600 server_key.pem

          echo "🚀 Deploying — changed dirs: $CHANGED_DIRS"

          ssh -i server_key.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            cd ${{ secrets.APP_PATH }}
            echo '📦 Pulling latest code...'
            git reset --hard
            git pull https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/5E-TECH/post_control_system.git main

            echo '🧾 Changed directories: $CHANGED_DIRS'

            # ===== Build React frontend if changed (NASHR QILINMAYDI) =====
            #
            # ⚠️ QURISH VA NASHR ATAYLAB AJRATILDI.
            #
            # Avval frontend shu yerda darhol /var/www/html/ ga ko'chirilardi —
            # ya'ni backend bosqichidan OLDIN. Backend bosqichida esa exit 1
            # qiladigan beshta qadam bor: db:backup (S3 kalitiga ham bog'liq),
            # migration, kassa invarianti, investor daftari, qo'shimcha xarajat
            # rekonsiliatsiyasi. Ulardan biri yiqilsa deploy to'xtardi, LEKIN
            # prodda allaqachon YANGI SPA + ESKI API qolardi.
            #
            # Aynan shunday holat 2026-09-21 da yuz berdi: S3 kaliti yaroqsiz
            # bo'lgani uchun deploy db:backup da yiqildi.
            #
            # Endi bu yerda faqat dist/ yig'iladi. Nashr backend migratsiya
            # va restartdan KEYIN, pastda bo'ladi.
            if [[ '$CHANGED_DIRS' == *'client'* ]]; then
              echo '📁 Building frontend (hozircha faqat quriladi)...'
              rm -rf client/dist client/build
              cd client
              npm ci --prefer-offline --legacy-peer-deps
              NODE_OPTIONS='--max-old-space-size=1024' npm run build
              cd ..
              # Qurilgan dist QAYSI commitdan ekanini belgilab qo'yamiz.
              # Nashr qarori shu shtampga qarab qabul qilinadi (pastga qarang).
              git rev-parse HEAD > client/dist/.deployed-sha
              echo '📦 Frontend qurildi — nashr backenddan keyin.'
            fi

            # ===== Build NestJS backend if changed =====
            if [[ '$CHANGED_DIRS' == *'server'* ]]; then
              echo '🧠 Building backend...'
              rm -rf server/dist
              cd server
              npm ci --prefer-offline --legacy-peer-deps
              NODE_OPTIONS='--max-old-space-size=1024' npm run build

              # ----- 🛡️ DB BACKUP (migration oldidan, MAJBURIY) -----
              echo '📦 Pre-migration DB backup...'
              if ! command -v pg_dump >/dev/null; then
                echo '❌ pg_dump topilmadi! sudo apt install -y postgresql-client kerak.'
                exit 1
              fi
              npm run db:backup

              # ----- 🩺 Cashbox invariant — BASELINE (migration oldidan) -----
              # Halt qilmaydi — faqat hozirgi drift-larni snapshot qiladi.
              echo '🩺 Pre-migration cashbox baseline snapshot...'
              npm run db:check-cashbox -- --snapshot=/tmp/cb-pre.json

              # ----- 🧮 Market hisob-kitobi — BASELINE (migration oldidan) -----
              # 2026-09-16..23 oralig'ida to'plangan tarixiy tafovut ATAYLAB
              # tuzatilmagan (qaror: faqat kod tuzatiladi). Shuning uchun bu
              # yerda ham snapshot/compare naqshi: halt faqat YANGI farqda.
              #
              # BIRINCHI DEPLOYDA BU BOSQICH O'TKAZIB YUBORILADI. Skript
              # o'qiydigan market_net/market_settled ustunlarini quyidagi
              # migratsiyaning O'ZI yaratadi, ya'ni hozir ular hali yo'q.
              # 2026-09-24 da deploy AYNAN shu sababli yiqilgan edi
              # (column o.market_net does not exist). Endi skript ustun
              # yo'qligini ko'rib schema_ready=false bayrog'i bilan
              # bo'sh baseline yozadi va 0 bilan chiqadi; pastdagi compare
              # o'sha bayroqni ko'rib birinchi yurishni qabul qiladi.
              echo '🧮 Pre-migration market settlement baseline...'
              npm run db:check-market-settlement -- --snapshot=/tmp/ms-pre.json

              # ----- 🧬 Migration ishga tushirish -----
              echo '🧬 Running TypeORM migrations...'
              npm run migration:show || true
              if ! npm run migration:run; then
                echo '❌ Migration XATO. App restart QILINMAYDI. Backupdan tiklash mumkin: server/backups/'
                exit 1
              fi

              # ----- 🩺 Cashbox invariant — COMPARE (migration keyin) -----
              # Yangi drift paydo bo'lsa yoki eski drift kattalashsa — halt.
              echo '🩺 Post-migration cashbox invariant (compare)...'
              if ! npm run db:check-cashbox -- --compare=/tmp/cb-pre.json; then
                echo '❌ POST-MIGRATION INVARIANT FAILED! Yangi drift paydo bo'\''ldi.'
                echo '   App restart QILINMAYDI. Ko'\''rib chiqing: npm run migration:revert yoki backupdan tiklang.'
                exit 1
              fi

              # ----- 🧮 Market hisob-kitob invarianti (compare, migration keyin) -----
              #
              # Nimani qo'riqlaydi: cash_box.balance == SUM(market_net − market_settled).
              # Bu ikkovi ajralib ketsa, marketga kassadagi HAMMA pulni to'lasangiz
              # ham buyurtmalar PAID ga o'tmay qoladi — 2026-09 da aynan shunday
              # bo'lgan va oylab sezilmagan, chunki bunday tekshiruv YO'Q edi.
              echo '🧮 Post-migration market settlement invariant (compare)...'
              if ! npm run db:check-market-settlement -- --compare=/tmp/ms-pre.json; then
                echo '❌ MARKET SETTLEMENT INVARIANT FAILED! App restart QILINMAYDI.'
                exit 1
              fi

              # ----- 🩺 Investor ledger invariant (strict, migration keyin) -----
              echo '🩺 Post-migration investor ledger invariant...'
              if ! npm run db:check-investor-ledger; then
                echo '❌ INVESTOR LEDGER INVARIANT FAILED! App restart QILINMAYDI.'
                exit 1
              fi

              # ----- 🧾 Qo'shimcha xarajat rekonsiliatsiyasi (strict) -----
              # Kassa invarianti balansni tarix bilan solishtiradi, LEKIN
              # xarajat SO'ROVLARI bilan kassa yozuvlari orasidagi bog'lanishni
              # ko'rmaydi. Ikki eng qimmat xato aynan o'sha yerda:
              #   "tasdiqlangan, lekin to'lanmagan"  (kuryer pulsiz qoladi)
              #   "rad etilgan, lekin to'langan"     (market rad etganini to'laydi)
              echo '🧾 Post-migration extra-cost reconciliation...'
              if ! npm run db:check-extra-cost; then
                echo '❌ EXTRA-COST INVARIANT FAILED! App restart QILINMAYDI.'
                exit 1
              fi

              # ----- 🎬 ffmpeg (video isbotni siqish) — YUMSHOQ tekshiruv -----
              # ⚠️ ATAYLAB exit 1 EMAS. ffmpeg yo'qligi ma'lumot yo'qotmaydi:
              # video shunchaki ASL (10-15 barobar katta) hajmda saqlanadi va
              # tizim ishlayveradi. Deploy'ni to'xtatish nomutanosib javob
              # bo'lardi — lekin bu jimgina o'tib ketmasligi ham kerak,
              # chunki disk sezilarli tez to'ladi.
              if command -v ffmpeg >/dev/null 2>&1; then
                # ⚠️ BUYRUQ TO'G'RIDAN-TO'G'RI ishlatiladi, buyruq
                # almashtirish (dollar + qavs) EMAS. Butun ssh bloki qo'sh
                # tirnoq ichida — u yerda buyruq almashtirish GitHub
                # runner'ida bajarilib, SERVERNING emas, runner'ning
                # versiyasini chop etardi. Shu sabab izohlarda ham
                # dollar-qavs va backtick ISHLATILMAYDI: ular izoh ichida
                # bo'lsa ham runner tomonidan bajariladi.
                echo '🎬 ffmpeg:'
                ffmpeg -version 2>/dev/null | head -1
              else
                echo '⚠️  ffmpeg TOPILMADI — video isbotlar siqilmaydi (disk ~10x tez to.ladi).'
                echo '    Tuzatish: sudo apt-get install -y ffmpeg'
              fi

              cd ..
            fi

            # ===== Restart backend if needed =====
            if [[ '$CHANGED_DIRS' == *'server'* ]] || [[ '$CHANGED_DIRS' == *'client'* ]]; then
              echo '🔁 Restarting backend systemd service...'
              sudo systemctl restart nestapp.service
              sleep 3
              sudo systemctl status nestapp --no-pager

              # ----- ✅ App ishga tushganini tekshirish -----
              if ! sudo systemctl is-active --quiet nestapp.service; then
                echo '❌ nestapp.service ishga tushmadi!'
                exit 1
              fi
              echo '✅ nestapp.service ishga tushdi.'
            fi

            # ===== Frontend NASHRI — eng oxirida =====
            #
            # ⚠️ NEGA AYNAN SHU YERDA. Bu qadarga yetib kelish uchun backend
            # to'liq o'tgan bo'lishi SHART: backup olingan, migratsiya
            # qo'llangan, kassa/investor/xarajat invariantlari toza va
            # servis ko'tarilgan. Yuqoridagilardan biri yiqilsa skript
            # set -e bilan shu yergacha YETIB KELMAYDI va prodda eski,
            # ISHLAYDIGAN frontend qoladi.
            #
            # Tartib «backend avval, frontend keyin»: qisqa vaqt eski SPA
            # yangi API bilan ishlaydi (API orqaga mos bo'lishi kerak —
            # odatdagi talab), teskarisi esa — yangi SPA eski API bilan —
            # darhol 404/422 beradi.
            #
            # ⚠️ SHART CHANGED_DIRS EMAS, SHTAMP.
            #
            # Agar bu blok CHANGED_DIRS ga bog'langan bo'lsa, quyidagi
            # ssenariy frontendni ABADIY eski holda qoldirardi:
            #   push #1 (client+server) -> client quriladi -> backend
            #     bosqichi yiqiladi -> nashr bo'lmaydi (to'g'ri)
            #   push #2 (faqat server tuzatishi) -> CHANGED_DIRS='server'
            #     -> nashr bloki O'TKAZIB YUBORILADI -> deploy YASHIL,
            #     lekin /var/www/html da push #1 dan OLDINGI SPA qoladi
            #     va u hech qachon o'z-o'zidan yangilanmaydi.
            #
            # Shuning uchun qaror 'shu push'da nima o'zgardi' dan emas,
            # 'serverda haqiqatan nima nashr qilingan' dan chiqariladi:
            # qurilgan dist dagi commit shtampi nashr qilingani bilan
            # solishtiriladi. Push #2 da dist hali push #1 shtampi bilan
            # turadi (u gitignore'da, git reset --hard uni o'chirmaydi),
            # shtamplar farq qiladi va nashr BAJARILADI.
            #
            # cmp va [[ ]] da $ yo'q — ikkalasi ham serverda bajariladi.
            # ⚠️ DARVOZA 1 — shu deployda HAQIQATAN ish bajarildimi.
            #
            # Bu shartsiz nashr bloki hujjat-only push'da ham ishlab
            # ketardi: client qurilmaydi, server qurilmaydi, migratsiya
            # yo'q, restart yo'q — lekin oldingi YIQILGAN deploydan
            # qolgan yangi dist prodga chiqib ketardi. Natija aynan
            # qochmoqchi bo'lgan holat: yangi SPA + eski API, deploy esa
            # YASHIL. Bu jamoada checklist-only push odatiy hol.
            if [[ '$CHANGED_DIRS' == *'client'* || '$CHANGED_DIRS' == *'server'* ]]; then

              # ⚠️ DARVOZA 2 — dist TO'LIQ bo'lsin.
              #
              # Avval faqat index.html tekshirilardi, pastda esa
              # .deployed-sha ishlatilardi. Eski tartib qurgan dist da
              # shtamp YO'Q: shunda webroot rm -rf qilinar, nusxalanar,
              # keyin shtamp nusxalash ENOENT bilan yiqilib deploy QIZIL
              # bo'lardi. Ikkala fayl ham shart.
              if [[ -f client/dist/index.html && -f client/dist/.deployed-sha ]]; then

                # ⚠️ DARVOZA 3 — nashr kerakmi.
                #
                # Birinchi shart webroot BO'SH qolgan holatni qaytaradi
                # (masalan oldingi deploy rm bilan cp orasida uzilgan):
                # shtamplar teng bo'lsa ham majburan qayta nashr qilinadi.
                #
                # sudo ATAYLAB ishlatilmaydi: webroot dunyo uchun
                # o'qiladigan, sudoers ga yangi bog'liqlik kerak emas.
                # Ruxsat yetmasa buyruq yiqiladi va nashr BAJARILADI —
                # xato tomon xavfsiz.
                if [[ ! -f /var/www/html/index.html ]] || ! cmp -s client/dist/.deployed-sha /var/www/html/.deployed-sha; then
                  echo '🚀 Frontend nashr qilinmoqda...'
                  sudo rm -rf /var/www/html/*
                  sudo cp -r client/dist/* /var/www/html/
                  # Shtamp FAQAT cp muvaffaqiyatidan keyin yangilanadi —
                  # aks holda nusxalash yarim yo'lda uzilsa, keyingi
                  # deploy 'allaqachon nashr qilingan' deb o'tkazib
                  # yuborardi.
                  sudo cp client/dist/.deployed-sha /var/www/html/.deployed-sha
                  echo '⚡️ Frontend deployed.'
                else
                  echo 'ℹ️  Frontend allaqachon shu versiyada — nashr qilinmadi.'
                fi
              else
                echo '⚠️  client/dist to.liq emas (index.html yoki .deployed-sha yo.q) — nashr qilinmadi.'
              fi
            else
              echo 'ℹ️  client ham, server ham o.zgarmagan — frontend nashri o.tkazib yuborildi.'
            fi

            echo '✅ Deployment completed successfully.'
          "
